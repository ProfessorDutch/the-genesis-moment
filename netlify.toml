[build]
  # Run the production build exactly as defined in package.json.
  command = "npm run build"

  # TanStack Start + Nitro's Netlify preset emits:
  #   - static assets into dist/
  #   - server functions into .netlify/functions-internal/
  # This MUST match the preset configured in vite.config.ts (nitro.preset = "netlify").
  # IMPORTANT: Do not set a "Publish directory" override in the Netlify UI.
  # If one is set (e.g. dist/client from an earlier Cloudflare-style config),
  # go to Site configuration → Build & deploy → Build settings and clear it
  # so this file controls the publish path.
  publish = "dist"

[build.environment]
  # Hard-pin the Nitro deploy target so auto-detection never falls back to
  # another preset (e.g. cloudflare-module) on Netlify's build machines.
  NITRO_PRESET = "netlify"
